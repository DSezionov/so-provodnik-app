name: scraper-tests

on:
  push:
    paths: ["scraper/**", ".github/workflows/scraper-tests.yml"]
  pull_request:
    paths: ["scraper/**", ".github/workflows/scraper-tests.yml"]

jobs:
  pytest:
    strategy:
      matrix:
        include:
          - python: "3.12" # CI target
            os: ubuntu-latest
          - python: "3.9" # compatibility floor; no 3.9 builds exist for Ubuntu 26.04
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
        working-directory: scraper
      # Offline: tests use cached fixture pages only, no requests to the wiki.
      - run: python -m pytest tests
        working-directory: scraper
